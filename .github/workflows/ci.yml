name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        pillow: ["nopillow", "pillow"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install pillow (full suite)
        if: matrix.pillow == 'pillow'
        run: pip install pillow
      # No ect/ffmpeg here on purpose: the suite is hermetic without them
      # (external tools are mocked; real-tool paths skip when absent).
      # Byte-level coverage with real ect lives in the byte-gate job below.
      - name: syntax check
        run: python3 -m py_compile fb2opt test_fb2opt.py
      - name: unit tests
        run: python3 test_fb2opt.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Gate on F/B/UP only: E501/SIM117 and friends are accepted tech
      # debt (mass reformat out of scope); ruff pinned for determinism.
      - name: ruff F/B/UP gate
        run: |
          pip install "ruff==0.15.*"
          ruff check --isolated --select F,B,UP fb2opt test_fb2opt.py bench.py
      # Complexity ratchet: pyproject pins today's maximum (23,
      # _run_optimize_batch); any function growing past it fails here.
      - name: ruff C901 budget gate
        run: |
          pip install "ruff==0.15.*"
          ruff check --select C901 fb2opt test_fb2opt.py bench.py

  byte-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install pillow
        run: pip install pillow
      # Real ect 0.9.5 from source + real ffmpeg: catches byte-level
      # regressions (like v4.9 --reuse) and exercises the SSIM metric
      # paths that hermetic tests always mock.
      - name: install ffmpeg and stock jpegtran
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libjpeg-turbo-progs
      - name: cache ect build
        id: ect-cache
        uses: actions/cache@v4
        with:
          path: /tmp/ect
          key: ect-0.9.5-${{ runner.os }}
      - name: build ect
        if: steps.ect-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v0.9.5 \
            https://github.com/fhanau/Efficient-Compression-Tool.git /tmp/ect
          cd /tmp/ect && git submodule update --init --recursive
          cmake -S src -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
      - name: put ect on PATH
        run: |
          echo "$(dirname "$(find /tmp/ect/build -name ect -type f | head -1)")" >> "$GITHUB_PATH"
      - name: byte-gate suite (real ect)
        run: python3 test_fb2opt.py
